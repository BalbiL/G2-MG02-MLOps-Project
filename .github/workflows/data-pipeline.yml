name: Data Pipeline ETL

on:
  # Pipeline manuel (pas de declenchement sur push)
  workflow_dispatch:

jobs:
  run-etl:
    name: Run Data Pipeline
    runs-on: ubuntu-latest
    
    steps:
      # Récupération du code
      - name: Checkout code
        uses: actions/checkout@v3

      # Installation de Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      # Installation des dépendances spécifiques au module data
      - name: Install Data Dependencies
        run: |
          pip install -r data/data_requirements.txt

      # Exécution du Pipeline
      - name: Run ETL Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }} 
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          # PYTHONPATH pour que les imports entre fichiers fonctionnent
          PYTHONPATH: .
        run: |
          python data/data_pipeline.py