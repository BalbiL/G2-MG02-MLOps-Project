name: Build and Push to ECR

on:
  push:
    branches:
      - deployment_version

env:
  AWS_REGION: eu-west-3               # Votre région (Paris)
  # Noms de vos repositories ECR
  ECR_REPO_ML: g2-mg02-news-reco-ml
  ECR_REPO_API: g2-mg02-news-reco-api
  ECR_REPO_FRONTEND: g2-mg02-news-reco-frontend

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest

    steps:
      # 1. Récupération du code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Installation de Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      # [TESTS] Configuration corrigée avec Mock Env Vars
      - name: Run Unit Tests
        env:
          PYTHONPATH: .
          # [CORRECTION] On donne des valeurs bidon pour que database.py ne plante pas à l'import
          SUPABASE_URL: "https://test.supabase.co"
          SUPABASE_KEY: "dummy-key-for-tests"
        run: |
          echo "Installation des dépendances de test..."
          pip install pytest httpx
          
          # Installation des libs nécessaires
          pip install fastapi uvicorn pydantic supabase
          
          echo "Running API Tests..."
          python -m pytest api/tests/
          
          echo "Running ML API Tests..."
          # Mockons aussi tensorflow si besoin dans le code de test, mais ici on lance juste
          python -m pytest ml/tests/

      # 3. Téléchargement des Modèles
      - name: Download ML Models
        run: |
          python download-models.py
          ls -R ml/models/

      # 4. Connexion à AWS (Avec clés IAM fixes)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      # 5. Build & Push - Service ML
      - name: Build and push ML image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPO_ML:latest -f ml/Dockerfile .
          docker push $ECR_REGISTRY/$ECR_REPO_ML:latest

      # 6. Build & Push - Service API
      - name: Build and push API image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPO_API:latest -f api/Dockerfile .
          docker push $ECR_REGISTRY/$ECR_REPO_API:latest

      # 7. Build & Push - Service Frontend
      - name: Build and push Frontend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPO_FRONTEND:latest -f frontend/Dockerfile .
          docker push $ECR_REGISTRY/$ECR_REPO_FRONTEND:latest

      # 8. Déploiement sur ECS (Force Update)
      - name: Force ECS Deployment
        run: |
          aws ecs update-service --cluster g2-mg02-news-reco-cluster --service g2-mg02-news-reco-task-service-nyvdt5tq --force-new-deployment --region eu-west-3