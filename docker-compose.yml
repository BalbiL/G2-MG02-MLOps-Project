services:
  # --- Service ML ---
  ml-service:
    build:
      context: .
      dockerfile: ml/Dockerfile
    container_name: ml-container
    ports:
      - "9000:9000"
    
    # 🟢 AJOUT DU HEALTHCHECK
    # Docker va exécuter cette commande régulièrement.
    # Tant qu'elle échoue (le modèle charge), le statut est "unhealthy".
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health')"]
      interval: 10s       # Réessaie toutes les 10 secondes
      timeout: 5s         # Timeout de la requête
      retries: 10         # Nombre d'essais avant de déclarer l'échec (ici on laisse ~100s au modèle pour charger)
      start_period: 30s   # Temps de grâce au démarrage avant de commencer à tester

  # --- Service API (Backend) ---
  api-service:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: api-container
    ports:
      - "8000:8000"
    environment:
      - MODEL_HOST=ml-service
      - MODEL_PORT=9000
      - SUPABASE_URL=${SUPABASE_URL} 
      - SUPABASE_KEY=${SUPABASE_KEY}
    depends_on:
      ml-service:
        condition: service_healthy  # ⚠️ On attend que le ML soit "Healthy" (et pas juste "Started")

  # --- Service Frontend (Streamlit) ---
  frontend-service:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: frontend-container
    ports:
      - "8501:8501"
    environment:
      - API_HOST=api-service
      - API_PORT=8000
      - MODEL_HOST=ml-service
      - MODEL_PORT=9000
    depends_on:
      # ⚠️ SYNTAXE CORRIGÉE (Format dictionnaire, pas de tirets)
      api-service:
        condition: service_started
      ml-service:
        condition: service_healthy